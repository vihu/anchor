[package]
description  = "A native Stremio client that plays through your own mpv"
edition      = "2024"
license      = "GPL-3.0-or-later"
name         = "anchor"
publish      = false
rust-version = "1.93"
version      = "0.1.0"

[workspace]
members = ["ui"]

[workspace.dependencies]
slint       = "1.18.1"
slint-build = "1.18.1"

[dependencies]
# The window, compiled from `ui/` in a crate of its own.
anchor-ui        = { path = "ui" }
camino           = "1.2"
directories      = "6"
# Stremio's dates: RFC 3339 timestamps.
jiff             = "0.2.37"
# Secret Service on Linux, Keychain on macOS.
keyring          = "4.2.0"
# Resource paths, as stremio-core encodes them.
percent-encoding = "2.3"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
# The user's extra mpv arguments, split as a shell would.
shlex            = "1.3"
slint            = { workspace = true }
ureq             = { version = "3.4.2", default-features = false, features = ["gzip", "json", "rustls"] }
# The cache's size on disk.
walkdir          = "2.5"
# Finds mpv on the PATH.
which            = "8"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
tempfile = "3.27"

# The builds in packaging/: link-time optimization and stripped symbols.
# `cargo build --release` stays quick for development.
[profile.dist]
codegen-units = 1
inherits      = "release"
lto           = "fat"
strip         = true
